services:
  pr-review-agent:
    build: .
    ports:
      - "8000:8000"
    env_file:
      - .env
    restart: unless-stopped
    depends_on:
      - hindsight
    environment:
      - HINDSIGHT_API_URL=http://hindsight:8888

  hindsight:
    image: ghcr.io/vectorize-io/hindsight:latest
    ports:
      - "8888:8888"
      - "9999:9999"
    environment:
      - HINDSIGHT_API_LLM_PROVIDER=groq
      - HINDSIGHT_API_LLM_API_KEY=${GROQ_API_KEY}
      - HINDSIGHT_API_LLM_MODEL=llama-3.1-8b-instant
    volumes:
      - hindsight_data:/home/hindsight/.pg0   
    restart: unless-stopped

volumes:
  hindsight_data: